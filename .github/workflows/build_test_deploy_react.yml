name: Build, Test and Deploy React Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Job 1 : Build → Test → Coverage → JSDoc → Artifact
  # ============================================================
  build_test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    defaults:
      run:
        working-directory: my-app

    permissions:
      contents: read

    env:
      REACT_APP_API_URL: https://jsonplaceholder.typicode.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: my-app/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Generate JSDoc (dans public/docs avant le build)
        run: npm run jsdoc

      - name: Build application React (inclut public/docs → build/docs)
        run: npm run build

      - name: Tests Unitaires et Intégration (avec couverture)
        run: npm test -- --watchAll=false --runInBand --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: my-app/coverage
          fail_ci_if_error: false

      - name: Upload rapport de couverture (artefact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: my-app/coverage/
          if-no-files-found: warn

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Upload artifact (app + docs)
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-app/build

  # ============================================================
  # Job 2 : Tests E2E (Cypress) contre l'infrastructure réelle
  # Instanciation complète via Docker Compose — aucun mock
  # ============================================================
  e2e:
    name: Tests E2E (Cypress) — Stack réelle
    runs-on: ubuntu-latest
    needs: build_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Créer le répertoire de secrets
        run: |
          mkdir -p .secrets
          echo "${{ secrets.MYSQL_ROOT_PASSWORD }}" > .secrets/mysql_root_password

      - name: Démarrer l'infrastructure complète (Docker Compose)
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Vérifier que tous les services sont opérationnels
        run: |
          echo "=== État des conteneurs ==="
          docker compose ps
          echo ""
          echo "=== Vérification API /health ==="
          curl -sf http://localhost:8000/health
          echo ""
          echo "=== Vérification API /users ==="
          curl -sf http://localhost:8000/users
          echo ""
          echo "=== Vérification React ==="
          curl -sf http://localhost:3000 > /dev/null && echo "React OK"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: my-app/package-lock.json

      - name: Installer les dépendances Cypress
        working-directory: my-app
        run: npm ci

      - name: Exécuter les tests Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          working-directory: my-app
          install: false
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120

      - name: Upload screenshots en cas d'échec
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: my-app/cypress/screenshots
          if-no-files-found: ignore

      - name: Logs de debug en cas d'échec
        if: failure()
        run: |
          echo "=== Docker Compose logs ==="
          docker compose logs
          echo "=== État des conteneurs ==="
          docker compose ps -a

      - name: Arrêter l'infrastructure
        if: always()
        run: docker compose down -v

  # ============================================================
  # Job 3 : Publication sur npm — nécessite build_test + e2e OK
  # Logique de bypass : publie uniquement si version locale > version npm
  # ============================================================
  publish-npm:
    name: Publish to NPM 📦
    runs-on: ubuntu-latest
    needs: [build_test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: my-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: my-app/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Vérifier si la version doit être publiée (bypass)
        id: version-check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Version locale : $LOCAL_VERSION"

          # Capturer stdout et stderr séparément pour distinguer les cas d'erreur
          NPM_OUTPUT=$(npm view ynov-inscription-form version 2>&1)
          NPM_EXIT=$?

          if [ $NPM_EXIT -eq 0 ]; then
            # Paquet existant — version récupérée avec succès
            NPM_VERSION=$NPM_OUTPUT
          elif echo "$NPM_OUTPUT" | grep -qE "E404|is not in this registry|Not found"; then
            # Paquet jamais publié — cas légitime de première publication
            NPM_VERSION="0.0.0"
            echo "Paquet non trouvé sur npm (première publication)"
          else
            # Erreur inattendue (réseau, registre indisponible, etc.) — on échoue explicitement
            echo "Erreur lors de la récupération de la version npm :"
            echo "$NPM_OUTPUT"
            exit 1
          fi

          echo "Version publiée sur npm : $NPM_VERSION"
          IS_GREATER=$(node -e "
            const toArr = v => v.split('.').map(Number);
            const [la, lb, lc] = toArr('$LOCAL_VERSION');
            const [pa, pb, pc] = toArr('$NPM_VERSION');
            const gt = la > pa || (la === pa && lb > pb) || (la === pa && lb === pb && lc > pc);
            console.log(gt ? 'true' : 'false');
          ")
          echo "should_publish=$IS_GREATER" >> $GITHUB_OUTPUT
          if [ "$IS_GREATER" = "true" ]; then
            echo "Nouvelle version détectée ($LOCAL_VERSION > $NPM_VERSION) — publication en cours."
          else
            echo "Aucune nouvelle version ($LOCAL_VERSION = $NPM_VERSION) — publication ignorée."
          fi

      - name: Build du package npm
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm run build-npm

      - name: Publier sur npm
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ============================================================
  # Job 4 : Build, Validation API & Push Docker Hub
  # Conditionné au succès total des tests E2E
  # ============================================================
  validate_and_push:
    name: Build, Validate API & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [publish-npm, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image MySQL
        run: docker build -t ynov-mysql:latest .

      - name: Build image API Python
        run: docker build -f Dockerfile.api -t ynov-api:latest .

      - name: Creer le reseau Docker
        run: docker network create ynov-net

      - name: Lancer le conteneur MySQL
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          docker run -d \
            --name mysql-container \
            --network ynov-net \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            -e MYSQL_DATABASE=ynov_ci \
            -v "$(pwd)/sqlfiles:/docker-entrypoint-initdb.d" \
            ynov-mysql:latest

      - name: Attendre que MySQL soit pret et initialise (table utilisateur presente)
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          echo "Attente de MySQL + migrations..."
          for i in $(seq 1 30); do
            if docker exec mysql-container mysql -uroot -p"$MYSQL_ROOT_PASSWORD" \
                -e "SELECT COUNT(*) FROM ynov_ci.utilisateur;" 2>/dev/null; then
              echo "MySQL pret apres ${i}x2s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "MySQL non pret apres 60s"
              docker logs mysql-container
              exit 1
            fi
            echo "Tentative $i/30..."
            sleep 2
          done

      - name: Lancer le conteneur API
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          docker run -d \
            --name api-container \
            --network ynov-net \
            -p 8000:8000 \
            -e MYSQL_HOST=mysql-container \
            -e MYSQL_USER=root \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            -e MYSQL_DATABASE=ynov_ci \
            ynov-api:latest

      - name: Attendre que l'API reponde (curl retry)
        run: |
          echo "Attente de l'API..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/users > /dev/null 2>&1; then
              echo "API prete apres ${i}x2s"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "API non accessible apres 30s"
              docker logs api-container
              exit 1
            fi
            echo "Tentative $i/15..."
            sleep 2
          done

      - name: Validation de l'endpoint /users via curl
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" http://localhost:8000/users)
          echo "HTTP Code: $HTTP_CODE"
          cat response.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ECHEC : code HTTP attendu 200, recu $HTTP_CODE"
            exit 1
          fi
          NB_USERS=$(python3 -c "import sys,json; d=json.load(open('response.json')); print(len(d.get('utilisateurs', [])))")
          echo "Nombre d'utilisateurs : $NB_USERS"
          if [ "$NB_USERS" = "0" ]; then
            echo "ECHEC : la liste utilisateurs est vide"
            exit 1
          fi
          echo "SUCCES : $NB_USERS utilisateur(s) retourne(s)"

      - name: Debug logs en cas d'echec
        if: failure()
        run: |
          echo "=== Logs MySQL ==="
          docker logs mysql-container || true
          echo "=== Logs API ==="
          docker logs api-container || true
          echo "=== Etat des conteneurs ==="
          docker ps -a

      - name: Connexion a Docker Hub
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag et push de l'image API vers Docker Hub
        run: |
          docker tag ynov-api:latest ${{ secrets.DOCKER_USERNAME }}/ynov-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/ynov-api:latest

  # ============================================================
  # Job 5 : Déploiement GitHub Pages — conditionné au succès E2E
  # (s'exécute même si publish-npm a été ignoré)
  # ============================================================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [publish-npm, e2e]
    if: ${{ always() && needs.e2e.result == 'success' && needs.publish-npm.result != 'failure' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
